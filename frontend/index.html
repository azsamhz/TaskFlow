<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap">
<section id="login" class="panel"><div class="logo">T <b>TaskFlow</b></div><h1>Bienvenido</h1><p>Inicia sesión para organizar tus pendientes.</p>
<form id="loginForm"><label for="email">Correo</label><input id="email" type="email" required><label for="password">Contraseña</label><input id="password" type="password" minlength="8" required><button>Iniciar sesión</button></form>
<hr><h2>Crear cuenta</h2><form id="registerForm"><label for="name">Nombre</label><input id="name" required><label for="newEmail">Correo</label><input id="newEmail" type="email" required><label for="newPassword">Contraseña (mínimo 8)</label><input id="newPassword" type="password" minlength="8" required><button>Registrarme</button></form><p id="authMsg" role="status"></p></section>
<section id="dashboard" class="panel hidden"><header><div class="logo">T <b>TaskFlow</b></div><button id="logout" class="secondary">Cerrar sesión</button></header><h1>Mis tareas</h1><p id="welcome"></p>
<form id="taskForm"><label for="title">Nueva tarea</label><input id="title" maxlength="120" placeholder="Título" required><label for="description">Descripción</label><textarea id="description" maxlength="500"></textarea><button>Agregar tarea</button></form><h2>Lista de tareas</h2><p id="appMsg" role="status"></p><div id="tasks"></div></section></main><script src="app.js"></script></body></html>
